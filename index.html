<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shyfoxie's Dream Studio</title>
    <meta name="description" content="A cozy, magical interactive visual art experience featuring continuous Diamond Painting, Falling Sand, and Bubble Pop Art for ambient streaming and relaxation." />
    <meta property="og:title" content="Shyfoxie's Dream Studio" />
    <meta property="og:description" content="A cozy, magical interactive visual art experience featuring continuous Diamond Painting, Falling Sand, and Bubble Pop Art for ambient streaming and relaxation." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0e0c1a] text-purple-100 overflow-hidden select-none font-['Quicksand',sans-serif]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Smart GitHub Pages Fallback:
      // If GitHub Pages is serving raw repository files instead of a build artifact,
      // seamlessly redirect to the pre-compiled /docs/ bundle.
      (function() {
        if (window.location.hostname.indexOf('github.io') !== -1 && window.location.pathname.indexOf('/docs') === -1) {
          var hasRawTsx = document.querySelector('script[src*="/src/main.tsx"]');
          if (hasRawTsx) {
            var cleanBase = window.location.pathname.replace(/\/+$/, '');
            window.location.replace(cleanBase + '/docs/' + window.location.search + window.location.hash);
          }
        }
      })();
    </script>
  </body>
</html>
